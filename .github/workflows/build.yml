name: Build VibeSync Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Inject Secrets into .env
      run: |
        echo "STATS_API_KEY=${{ secrets.STATS_API_KEY }}" > .env
        echo "STATS_BASE_URL=https://database.airbeats.app" >> .env
        echo "GLOBAL_STATS_FILE=airbeats/global_stats.json" >> .env
        echo "FCM_STATS_FILE=airbeats/fcm.json" >> .env
        echo "MAX_GLOBAL_USERS=10000000" >> .env
        echo "PROJECT_ID=${{ secrets.PROJECT_ID }}" >> .env
        echo "AUTH_API_BASE_URL=https://auth.airbeats.app" >> .env


    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Python backend (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --name server --onedir --noconsole --add-data "templates;templates" --add-data "static;static" --collect-data ytmusicapi -y app.py

    - name: Build Python backend (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --name server --onedir --noconsole --add-data "templates:templates" --add-data "static:static" --collect-data ytmusicapi -y app.py
        mv dist/server/server dist/server/server.exe
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Sync VibeSync package version from release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ./electron-app
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        VERSION_NAME="${TAG_NAME#v}"
        echo "Detected tag: $TAG_NAME, injecting version: $VERSION_NAME into package.json"
        node -e "let pkg=require('./package.json'); pkg.version='$VERSION_NAME'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
        npm install --package-lock-only --ignore-scripts


    - name: Install VibeSync desktop dependencies
      working-directory: ./electron-app
      run: npm ci

    - name: Validate Windows branding asset
      if: matrix.os == 'windows-latest'
      working-directory: ./electron-app
      run: |
        npm run generate:icon
        npm run validate:branding

    - name: Configure Windows Authenticode signing
      if: matrix.os == 'windows-latest'
      shell: pwsh
      env:
        WINDOWS_CSC_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CSC_CERTIFICATE_BASE64 }}
        WINDOWS_CSC_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CSC_CERTIFICATE_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_CERTIFICATE_BASE64)) {
          throw "WINDOWS_CSC_CERTIFICATE_BASE64 repository secret is required. Unsigned Windows installers are blocked by Smart App Control."
        }
        if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_CERTIFICATE_PASSWORD)) {
          throw "WINDOWS_CSC_CERTIFICATE_PASSWORD repository secret is required."
        }

        $certificatePath = Join-Path $env:RUNNER_TEMP "vibesync-code-signing.pfx"
        [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CSC_CERTIFICATE_BASE64))
        "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CSC_KEY_PASSWORD=$env:WINDOWS_CSC_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build VibeSync app (Windows x64)
      if: matrix.os == 'windows-latest'
      working-directory: ./electron-app
      run: npm run build

    - name: Build Electron app (macOS)
      if: matrix.os == 'macos-latest'
      working-directory: ./electron-app
      run: npx electron-builder --mac --publish never

    - name: Install Snapcraft (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo snap install lxd
        sudo lxd init --auto
        sudo usermod -a -G lxd $USER
        sudo snap install snapcraft --classic

    - name: Build Electron app (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ./electron-app
      env:
        SNAPCRAFT_BUILD_ENVIRONMENT: lxd
      run: |
        sg lxd -c "npx electron-builder --linux --publish never"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VibeSync-${{ matrix.os }}
        path: |
          electron-app/dist/*.exe
          electron-app/dist/*.dmg
          electron-app/dist/*.AppImage
          electron-app/dist/*.deb
          electron-app/dist/*.snap

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          electron-app/dist/*.exe
          electron-app/dist/*.dmg
          electron-app/dist/*.AppImage
          electron-app/dist/*.deb
          electron-app/dist/*.snap

    - name: Publish to Canonical Snap Store
      if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      run: |
        snapcraft upload electron-app/dist/*.snap --release=stable
